name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libsqlite3-dev
        # Usando versões fixas conhecidas por serem estáveis com Kivy 2.3
        pip install --upgrade "buildozer==1.5.0" "Cython==0.29.33" virtualenv

    - name: Cache Buildozer
      uses: actions/cache@v3
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

    - name: Build with Buildozer
      run: |
        # Aceita licenças e compila. 
        # O buildozer 1.5.0 aceita --accept-sdk-license se configurado no spec, 
        # mas mantemos o yes para garantir compatibilidade total.
        yes | buildozer android debug

    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
