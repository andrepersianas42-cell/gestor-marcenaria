name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libsqlite3-dev
        # Usando versões fixas conhecidas por serem estáveis com Kivy 2.3
        pip install --upgrade "buildozer==1.5.0" "Cython==0.29.33" virtualenv

    - name: Cache Buildozer
      uses: actions/cache@v3
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

    - name: Build with Buildozer
      id: buildozer
      run: |
        yes | buildozer android debug
      continue-on-error: true

    - name: Upload APK artifacts
      if: steps.buildozer.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: GestorMarcenaria-APK
        path: bin/*.apk

    - name: Publish APK as GitHub Release
      if: steps.buildozer.outcome == 'success'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: apk-build-${{ github.run_number }}
        name: "Gestor Marcenaria - Build ${{ github.run_number }}"
        body: "APK gerado automaticamente. Clique no arquivo .apk abaixo para baixar."
        files: bin/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Buildozer logs on failure
      if: steps.buildozer.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-logs
        path: .buildozer/android/app/build.log
